<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>EntrenaPro · Gestión de clientes</title>
  <meta name="description" content="Gestiona clientes, sesiones, progreso y pagos como entrenador personal.">
  <meta name="theme-color" content="#0f766e">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='24' fill='%230f766e'/><path d='M30 30v40M70 30v40M18 40v20M82 40v20M30 50h40' stroke='white' stroke-width='9' stroke-linecap='round'/></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>
  <div class="layout">
    <nav class="sidebar" aria-label="Navegación principal">
      <div class="brand">
        <span class="brand-logo" data-icon="logo"></span>
        <span class="brand-name">EntrenaPro<small>Gestión de clientes</small></span>
      </div>
      <a href="#/panel" data-nav="panel"><span data-icon="dashboard"></span><span>Panel</span></a>
      <a href="#/clientes" data-nav="clientes"><span data-icon="users"></span><span>Clientes</span></a>
      <a href="#/agenda" data-nav="agenda"><span data-icon="calendar"></span><span>Agenda</span></a>
      <a href="#/pagos" data-nav="pagos"><span data-icon="wallet"></span><span>Pagos</span></a>
      <a href="#/ajustes" data-nav="ajustes"><span data-icon="settings"></span><span>Ajustes</span></a>
    </nav>
    <main id="app" tabindex="-1"></main>
  </div>

  <dialog id="modal" aria-labelledby="modal-title">
    <form method="dialog" id="modal-form" novalidate>
      <header class="modal-header">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar" data-icon="close"></button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-footer" id="modal-footer"></footer>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>

  <script src="js/utils.js"></script>
  <script src="js/store.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/views.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
