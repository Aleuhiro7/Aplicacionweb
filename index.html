  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

      <a href="#/panel" class="brand" aria-label="Ir al resumen">
        <span class="brand-logo">DO</span>
        <span class="brand-name"><span>David Orihuela</span><small>Coach</small></span>
      </a>
      <div class="nav-main">
        <a href="#/panel" data-nav="panel"><span data-icon="home"></span><span>Resumen</span></a>
        <a href="#/clientes" data-nav="clientes"><span data-icon="users"></span><span>Clientes</span></a>
        <a href="#/pagos" data-nav="pagos"><span data-icon="euro"></span><span>Pagos</span></a>
        <a href="#/biblioteca" data-nav="biblioteca"><span data-icon="book"></span><span>Biblioteca de ejercicios</span></a>
        <a href="#/alimentos" data-nav="alimentos"><span data-icon="apple"></span><span>Biblioteca de alimentos</span></a>
      </div>
      <div class="nav-bottom">

      </div>
    </nav>
    <div class="content">

        <button class="btn primary pill" data-action="new-client"><span data-icon="plus"></span><span class="pill-text">Nuevo cliente</span></button>
        <button class="icon-btn bell sync-btn" data-sync="open" aria-label="Sincronización" title="Sincronización"><span data-icon="cloud"></span><span class="dot" id="sync-dot"></span></button>
        <button class="icon-btn menu-btn" data-menu="open" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"><span data-icon="menu"></span></button>
      </header>
      <main id="app" tabindex="-1"></main>
    </div>
  </div>

  <div class="menu-backdrop" data-menu="close"></div>

  <dialog id="modal" aria-labelledby="modal-title">
    <form method="dialog" id="modal-form" novalidate>
      <header class="modal-header">
        <h2 id="modal-title"></h2>
        <button type="button" class="icon-btn" data-close aria-label="Cerrar" data-icon="close"></button>
      </header>
      <div class="modal-body" id="modal-body"></div>
      <footer class="modal-footer" id="modal-footer"></footer>
    </form>
  </dialog>

  <div id="toast" role="status" aria-live="polite"></div>
